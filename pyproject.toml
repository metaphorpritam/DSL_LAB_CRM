[project]
name = "dsl-lab"
version = "0.1.0"
description = "End-to-end credit-default risk modelling on the Kaggle 'Give Me Some Credit' dataset — EDA, Mixture-of-Experts NN, gradient boosting, knowledge distillation, CIBIL scoring, SHAP, and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.0",
    "matplotlib>=3.10.8",
    "missingno>=0.5.2",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "catboost>=1.2.0",
    "umap-learn>=0.5.7",
    "xlrd>=2.0.2",
    "xgboost>=2.0.0",
    "optuna>=4.8.0",
    "statsmodels>=0.14.6",
    "shap>=0.51.0",
    "plotly>=6.6.0",
    "nbformat>=5.10.4",
    "streamlit>=1.45.0",
    "altair>=5.0.0",
    "gspread>=6.0.0",
    "nbconvert>=7.16.0",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "google-auth-httplib2>=0.3.1",
]
